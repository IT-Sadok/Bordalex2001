name: CI

on:
  push:
    branches:
      - feature/**
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

env:
  DOTNET_VERSION: "9.x"
  NUGET_PACKAGES_DIR: "~/.nuget/packages"
  SOLUTION_PATH: "BookingSystemApi/BookingSystemApi.sln"
  API_PROJECT_PATH: "BookingSystemApi/WebApi/WebApi.csproj"
  PUBLISH_DIR: "./publish"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ vars.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ${{ env.NUGET_PACKAGES_DIR }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget

    - name: Check vulnerable packages
      run: dotnet list ${{ env.SOLUTION_PATH }} package --vulnerable

    - name: Check formatting
      run: dotnet format ${{ env.SOLUTION_PATH }}

    - name: Restore dependencies
      run: dotnet restore ${{ vars.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ vars.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Run tests
      run: dotnet test ${{ vars.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

    - name: Publish API
      run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_DIR }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapi-build
        path: ${{ env.PUBLISH_DIR }}

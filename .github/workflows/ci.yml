name: CI

on:
  push:
    branches:
      - feature/**
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    # -----------------------------
    # Setup .NET 9 and build/test solution
    # -----------------------------
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ vars.DOTNET_VERSION }}

    - name: Remove docker-compose.dcproj
      run: dotnet sln ${{ vars.SOLUTION_PATH }} remove ${{ vars.DOCKER_COMPOSE_PATH }}

    - name: Restore dependencies
      run: dotnet restore ${{ vars.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ vars.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Run tests
      run: dotnet test ${{ vars.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

    # -----------------------------
    # Check vulnerable packages and formatting
    # -----------------------------
    - name: Check vulnerable packages
      run: dotnet list ${{ vars.SOLUTION_PATH }} package --vulnerable

    - name: Check formatting
      run: dotnet format ${{ vars.SOLUTION_PATH }}

    # -----------------------------
    # Start Docker Compose services
    # -----------------------------
    - name: Start services with Docker Compose
      run: docker compose up -d --build
      env:
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}

        ASPNETCORE_ENVIRONMENT: ${{ vars.ASPNETCORE_ENVIRONMENT }}
        API_HTTP_PORT: ${{ vars.API_HTTP_PORT }}

        JWT_KEY: ${{ secrets.JWT_KEY }}
        JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
        JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
        JWT_EXPIRY: ${{ vars.JWT_EXPIRY }}
        
    # -----------------------------
    # Wait for API
    # -----------------------------
    - name: Wait for API to be healthy
      run: |
        for i in {1..15}; do
          if curl -f http://localhost:${{ vars.API_HTTP_PORT }}; then
            echo "API is up"
            exit 0
          fi
          echo "Waiting for API..."
          sleep 5
        done
        echo "API failed to start"
        docker compose logs
        exit 1

    # -----------------------------
    # Smoke API test
    # -----------------------------
    - name: Test Swagger endpoint
      run: curl -f http://localhost:${{ vars.API_HTTP_PORT }}/swagger || (echo "Swagger endpoint is not reachable" && exit 1)

    # -----------------------------
    # Logs if failed
    # -----------------------------
    - name: Show Docker Compose logs if API failed
      if: failure()
      run: docker compose logs

    # -----------------------------
    # Stop Docker Compose services
    # -----------------------------
    - name: Stop services
      if: always()
      run: docker compose down -v
